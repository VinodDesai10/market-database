{% extends "layout.html" %}
{% block content %}
<div class="fade-page">
  <div class="card border-0 shadow-sm p-4 rounded-4">
    <h4 class="fw-bold text-gradient mb-4">Add New Vendor</h4>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('add_vendor') }}" class="row g-3">
      <div class="col-md-4">
        <label for="vendor_id" class="form-label fw-semibold">Vendor ID</label>
        <input type="number" class="form-control" id="vendor_id" name="vendor_id" required>
      </div>
      <div class="col-md-8">
        <label for="name" class="form-label fw-semibold">Vendor Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="col-md-6">
        <label for="pancard" class="form-label fw-semibold">PAN Card</label>
        <input type="text" class="form-control" id="pancard" name="pancard" required>
      </div>
      <div class="col-md-12">
        <label for="phone_number" class="form-label fw-semibold">Phone Number</label>
        <input type="text" class="form-control" id="phone_number" name="phone_number" required>
      </div>

      <div class="col-12 text-end">
        <button type="submit" class="btn btn-cta px-4">Add Vendor</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
