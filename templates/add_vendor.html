{% extends 'layout.html' %}

{% block content %}
    <h1 class="mb-4">Add New Vendor</h1>

    <!-- Flash messages for success or error -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card">
        <div class="card-header">
            Enter Vendor Details
        </div>
        <div class="card-body">
            <form action="{{ url_for('add_vendor') }}" method="POST">
                <div class="mb-3">
                    <label for="vendor_id" class="form-label">Vendor ID</label>
                    <input type="number" class="form-control" id="vendor_id" name="vendor_id" required>
                </div>
                <div class="mb-3">
                    <label for="vendor_name" class="form-label">Vendor Name</label>
                    <input type="text" class="form-control" id="vendor_name" name="vendor_name" required>
                </div>
                <div class="mb-3">
                    <label for="vendor_email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="vendor_email" name="vendor_email" required>
                </div>
                 <div class="mb-3">
                    <label for="vendor_pancard" class="form-label">PAN Card</label>
                    <input type="text" class="form-control" id="vendor_pancard" name="vendor_pancard" required>
                </div>
                 <div class="mb-3">
                    <label for="vendor_phone_number" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="vendor_phone_number" name="vendor_phone_number" required>
                </div>
                <button type="submit" class="btn btn-primary">Add Vendor</button>
            </form>
        </div>
    </div>
{% endblock %}
