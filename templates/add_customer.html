{% extends "layout.html" %}
{% block content %}
<div class="fade-page">
  <div class="card border-0 shadow-sm p-4 rounded-4">
    <h4 class="fw-bold text-gradient mb-4">Add New Customer</h4>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('add_customer') }}" class="row g-3">
      <div class="col-md-4">
        <label for="customer_id" class="form-label fw-semibold">Customer ID</label>
        <input type="number" class="form-control" id="customer_id" name="customer_id" required>
      </div>
      <div class="col-md-8">
        <label for="name" class="form-label fw-semibold">Customer Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
      <div class="col-12">
        <label for="address" class="form-label fw-semibold">Address</label>
        <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
      </div>

      <div class="col-12 text-end">
        <button type="submit" class="btn btn-cta px-4">Add Customer</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
