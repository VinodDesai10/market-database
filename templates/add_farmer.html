{% extends 'layout.html' %}

{% block content %}
    <h1 class="mb-4">Add New Farmer</h1>

    <!-- Flash messages for success or error -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card">
        <div class="card-header">
            Enter Farmer Details
        </div>
        <div class="card-body">
            <form action="{{ url_for('add_farmer') }}" method="POST">
                <div class="mb-3">
                    <label for="farmer_id" class="form-label">Farmer ID</label>
                    <input type="number" class="form-control" id="farmer_id" name="farmer_id" required>
                </div>
                <div class="mb-3">
                    <label for="farmer_name" class="form-label">Farmer Name</label>
                    <input type="text" class="form-control" id="farmer_name" name="farmer_name" required>
                </div>
                <div class="mb-3">
                    <label for="farmer_phone_number" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="farmer_phone_number" name="farmer_phone_number" required>
                </div>
                <div class="mb-3">
                    <label for="farmer_address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="farmer_address" name="farmer_address" required>
                </div>
                <button type="submit" class="btn btn-primary">Add Farmer</button>
            </form>
        </div>
    </div>
{% endblock %}
