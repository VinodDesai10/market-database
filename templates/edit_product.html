{% extends "layout.html" %}
{% block content %}
<div class="fade-page">
  <h2 class="fw-bold text-gradient mb-4">Edit Product</h2>

  <form method="POST" class="card p-4 shadow-sm border-0 rounded-4">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Product Name</label>
        <input type="text" class="form-control" name="name" value="{{ product.product_name }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Category</label>
        <input type="text" class="form-control" name="category" value="{{ product.category }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Quantity</label>
        <input type="number" class="form-control" name="quantity" value="{{ product.product_quantity }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Price (₹)</label>
        <input type="number" class="form-control" name="price" value="{{ product.product_price }}" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary mt-4">Save Changes</button>
    <a href="{{ url_for('products_list') }}" class="btn btn-outline-secondary mt-4 ms-2">Cancel</a>
  </form>
</div>
{% endblock %}
