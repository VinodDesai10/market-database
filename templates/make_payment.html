{% extends "layout.html" %}
{% block content %}
<div class="fade-page">
  <h2 class="fw-bold text-gradient mb-4">Make a Payment</h2>

  <form method="POST" class="card p-4 shadow-sm border-0 rounded-4">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Select Order</label>
        <select name="order_id" class="form-select" required>
          <option value="">-- Choose an Order --</option>
          {% for o in orders %}
          <option value="{{ o.order_id }}">
            Order #{{ o.order_id }} — Customer ID: {{ o.customer_id }} — ₹{{ o.order_amount }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Payment Amount (₹)</label>
        <input type="number" class="form-control" name="payment_amount" min="1" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary mt-4">Submit Payment</button>
  </form>
</div>
{% endblock %}
