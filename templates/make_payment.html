{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                Make a Payment
            </div>
            <div class="card-body">

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form action="{{ url_for('submit_payment') }}" method="POST">
                    <div class="mb-3">
                        <label for="payment_id" class="form-label">New Payment ID</label>
                        <input type="number" class="form-control" id="payment_id" name="payment_id" required>
                    </div>
                    <div class="mb-3">
                        <label for="order_id" class="form-label">Order ID</label>
                        <input type="number" class="form-control" id="order_id" name="order_id" required>
                    </div>
                    <div class="mb-3">
                        <label for="payment_amount" class="form-label">Payment Amount (₹)</label>
                        <input type="number" class="form-control" id="payment_amount" name="payment_amount" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Payment</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
