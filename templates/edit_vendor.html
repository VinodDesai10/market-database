{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                Edit Vendor (ID: {{ vendor.vendor_id }})
            </div>
            <div class="card-body">
                <form action="{{ url_for('update_vendor', id=vendor.vendor_id) }}" method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Vendor ID</label>
                            <input type="text" class="form-control" value="{{ vendor.vendor_id }}" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="vendor_name" class="form-label">Vendor Name</label>
                            <input type="text" class="form-control" id="vendor_name" name="vendor_name" value="{{ vendor.vendor_name }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="vendor_email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="vendor_email" name="vendor_email" value="{{ vendor.vendor_email }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="vendor_pancard" class="form-label">PAN Card</label>
                            <input type="text" class="form-control" id="vendor_pancard" name="vendor_pancard" value="{{ vendor.vendor_pancard }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="vendor_phone" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="vendor_phone" name="vendor_phone" value="{{ vendor.vendor_phone_number }}">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('vendors_list') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
