{% extends "layout.html" %}
{% block content %}
<div class="fade-page">
  <h2 class="fw-bold text-gradient mb-4">Restock / Supply Products</h2>

  <form method="POST" class="card p-4 shadow-sm border-0 rounded-4">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Farmer</label>
        <select name="farmer_id" class="form-select" required>
          <option value="">-- Select Farmer --</option>
          {% for f in farmers %}
          <option value="{{ f.farmer_id }}">{{ f.farmer_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Vendor</label>
        <select name="vendor_id" class="form-select" required>
          <option value="">-- Select Vendor --</option>
          {% for v in vendors %}
          <option value="{{ v.vendor_id }}">{{ v.vendor_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Product</label>
        <select name="product_id" class="form-select" required>
          <option value="">-- Select Product --</option>
          {% for p in products %}
          <option value="{{ p.product_id }}">{{ p.product_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Quantity Supplied</label>
        <input type="number" name="quantity" min="1" class="form-control" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary mt-4">Record Supply</button>
  </form>
</div>
{% endblock %}
