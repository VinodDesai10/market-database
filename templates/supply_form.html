{% extends 'layout.html' %}

{% block content %}
    <h1 class="mb-4">Restock Inventory</h1>

    <!-- Flash messages for success or error -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card">
        <div class="card-header">
            Enter Supply Details
        </div>
        <div class="card-body">
            <!-- 
              FIXED: The action now correctly points to 'submit_supply_form' 
              which matches the function name in app.py
            -->
            <form action="{{ url_for('submit_supply_form') }}" method="POST">
                <div class="mb-3">
                    <label for="farmer_id" class="form-label">Farmer ID</label>
                    <input type="number" class="form-control" id="farmer_id" name="farmer_id" required>
                </div>
                <div class="mb-3">
                    <label for="vendor_id" class="form-label">Vendor ID</label>
                    <input type="number" class="form-control" id="vendor_id" name="vendor_id" required>
                </div>
                <div class="mb-3">
                    <label for="product_id" class="form-label">Product ID</label>
                    <input type="number" class="form-control" id="product_id" name="product_id" required>
                </div>
                <div class="mb-3">
                    <label for="quantity" class="form-label">Quantity Supplied</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" required min="1">
                </div>
                <button type="submit" class="btn btn-primary">Submit Supply</button>
            </form>
        </div>
    </div>
{% endblock %}
