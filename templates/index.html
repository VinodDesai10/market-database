{% extends "layout.html" %}
{% block content %}
<div class="fade-page">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-gradient">Customers Overview</h2>
    <a href="{{ url_for('add_customer') }}" class="btn btn-primary shadow-sm">+ Add Customer</a>
  </div>

  <div class="card p-3 border-0 shadow-sm rounded-4">
    <div class="card-body">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Customer ID</th>
            <th>Name</th>
            <th>Address</th>
          </tr>
        </thead>
        <tbody>
          {% for customer in customers %}
          <tr>
            <td>{{ customer.customer_id }}</td>
            <td>{{ customer.customer_name }}</td>
            <td>{{ customer.customer_address }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
