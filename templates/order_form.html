{% extends "layout.html" %}
{% block content %}
<div class="fade-page">
  <h2 class="fw-bold text-gradient mb-4">Place a New Order</h2>

  <form method="POST" class="card p-4 shadow-sm border-0 rounded-4">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Customer</label>
        <select class="form-select" name="customer_id" required>
          <option value="">-- Select Customer --</option>
          {% for c in customers %}
          <option value="{{ c.customer_id }}">{{ c.customer_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Vendor</label>
        <select id="vendorSelect" class="form-select" name="vendor_id" required>
          <option value="">-- Select Vendor --</option>
          {% for v in vendors %}
          <option value="{{ v.vendor_id }}">{{ v.vendor_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Product</label>
        <select id="productSelect" class="form-select" name="product_id" required disabled>
          <option value="">-- Select Vendor First --</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Quantity</label>
        <input type="number" name="quantity" min="1" class="form-control" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary mt-4">Place Order</button>
  </form>
</div>

<!-- JS to dynamically load products based on vendor -->
<script>
document.getElementById("vendorSelect").addEventListener("change", function() {
  const vendorId = this.value;
  const productSelect = document.getElementById("productSelect");

  productSelect.innerHTML = '<option>Loading...</option>';
  productSelect.disabled = true;

  if (vendorId) {
    fetch(`/get_vendor_products/${vendorId}`)
      .then(response => response.json())
      .then(data => {
        productSelect.innerHTML = "";
        if (data.length === 0) {
          productSelect.innerHTML = '<option value="">No products in stock</option>';
        } else {
          productSelect.innerHTML = '<option value="">-- Select Product --</option>';
          data.forEach(item => {
            const option = document.createElement("option");
            option.value = item.product_id;
            option.textContent = `${item.product_name} — ₹${item.product_price} (Stock: ${item.product_quantity})`;
            productSelect.appendChild(option);
          });
        }
        productSelect.disabled = false;
      })
      .catch(err => {
        console.error("Error fetching products:", err);
        productSelect.innerHTML = '<option>Error loading products</option>';
      });
  }
});
</script>
{% endblock %}
