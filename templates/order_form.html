{% extends 'layout.html' %}

{% block content %}
    <h1 class="mb-4">Place a New Order</h1>

    <div class="card">
        <div class="card-header">
            New Order Details
        </div>
        <div class="card-body">
            
            <!-- This form's "action" has been corrected to point to the correct function -->
            <form action="{{ url_for('submit_order_form') }}" method="POST">
                
                <!-- Display success or error messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="mb-3">
                    <label for="order_id" class="form-label">Order ID (e.g., 550):</label>
                    <input type="number" class="form-control" id="order_id" name="order_id" required>
                </div>
                <div class="mb-3">
                    <label for="customer_id" class="form-label">Customer ID (e.g., 1):</label>
                    <input type="number" class="form-control" id="customer_id" name="customer_id" required>
                </div>
                <div class="mb-3">
                    <label for="vendor_id" class="form-label">Vendor ID (e.g., 101):</label>
                    <input type="number" class="form-control" id="vendor_id" name="vendor_id" required>
                </div>
                <div class="mb-3">
                    <label for="product_id" class="form-label">Product ID (e.g., 301):</label>
                    <input type="number" class="form-control" id="product_id" name="product_id" required>
                </div>
                <div class="mb-3">
                    <label for="quantity" class="form-label">Quantity:</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" required>
                </div>

                <button type="submit" class="btn btn-primary">Submit Order</button>
            </form>
        </div>
    </div>
{% endblock %}
